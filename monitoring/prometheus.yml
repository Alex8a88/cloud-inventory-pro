# ============================================================
# Cloud Inventory Pro - Configuración Prometheus
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus se monitorea a sí mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Métricas del backend Spring Boot
  - job_name: 'cloud-inventory-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']